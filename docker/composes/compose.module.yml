services:
  center:
    volumes:
      - $LOCAL_WS/config/dds-uri/cycloneDDS.xml:/tmp/dds.xml
      - $VISION_WS/center-pkg:/home/center/vision-ws/src/center-ros
    command: bash

  realsense:
    volumes:
      - /dev:/dev
      - $LOCAL_WS/config/dds-uri/localDDS.xml:/tmp/dds.xml
      - $VISION_WS/realsense-pkg/config:/home/realsense/vision-ws/src/realsense-ros/realsense2_camera/launch/config
      - $VISION_WS/realsense-pkg/visual_presets:/home/realsense/vision-ws/src/realsense-ros/realsense2_camera/launch/visual_presets
      - $VISION_WS/camera-pkg:/home/realsense/vision-ws/src/camera-ros
    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 189:* rmw"
      # sleep 5 &&
      # ros2 launch camera_ros image_stitch.launch.py;
    command: ["/ros_entrypoint.sh", "ros2", "launch", "realsense2_camera", "rs_triple_camera_launch.py"]

  aruco:
    volumes:
      - $LOCAL_WS/config/dds-uri/localDDS.xml:/tmp/dds.xml
      - $VISION_WS/aruco-pkg:/home/aruco/vision-ws/src/aruco-ros
    command: >
      bash -ic "
      colcon build --parallel-workers 6;
      source /home/aruco/vision-ws/install/local_setup.bash;
      ros2 launch aruco_ros CB_ALL.launch.py;
      "
  
  ultralytics-ros:
    volumes:
      - $LOCAL_WS/config/dds-uri/localDDS.xml:/tmp/dds.xml
      - $VISION_WS/ultralytics-pkg:/home/ultralytics/vision-ws/src/ultralytics-ros
    command: bash

    
      # bash -ic "
      # colcon build;
      # source /home/ultralytics/vision-ws/install/local_setup.bash;
      # ros2 launch ultralytics_ros yolo_launch.py
      # "

  ultralytics-training:
    volumes:
      - $LOCAL_WS/dataset:/root/train
    working_dir: /root/train
    command: bash
      # bash -ic 'nvidia-smi && bash'
  
  gui:
    volumes:
      # X11 socket
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/home/gui/.Xauthority
      # Wayland socket
      # - $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY:/tmp/$WAYLAND_DISPLAY
      # GUI config
      - $LOCAL_WS/config/gui-config:/home/gui/.rviz2
      - $LOCAL_WS/config/dds-uri/localDDS.xml:/tmp/dds.xml
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml address:=localhost port:=8765

  stitch:
    volumes:
      - $LOCAL_WS/config/dds-uri/localDDS.xml:/tmp/dds.xml
      - $VISION_WS/camera-pkg:/home/stitch/vision-ws/src/camera-ros
      - $VISION_WS/stitch-pkg:/home/stitch/vision-ws/src/stitch-vulkan
      - $VISION_WS/pose-pkg:/home/stitch/vision-ws/src/pose-camera
      # vulkan
      - $XDG_RUNTIME_DIR:$XDG_RUNTIME_DIR
      - $HOME/.Xauthority:/home/stitch/.Xauthority:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d
      - /usr/share/vulkan/explicit_layer.d:/usr/share/vulkan/explicit_layer.d
      - /usr/share/vulkan/implicit_layer.d:/usr/share/vulkan/implicit_layer.d
    device_cgroup_rules:
      - "c 226:* rmw"
    command: bash

  stitcher:
    volumes:
      - $LOCAL_WS/config/dds-uri/jethDDS.xml:/tmp/dds.xml
      - $VISION_WS/camera-pkg:/home/stitcher/vision-ws/src/camera-ros
    command: bash