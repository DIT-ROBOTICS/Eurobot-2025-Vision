services:
  aruco:
    image: vision-main:aruco
    container_name: aruco
    volumes:
      - $LOCAL_WORKSPACE_FOLDER/config/dds-uri/localDDS.xml:/tmp/cycloneDDS.xml
      - $LOCAL_WORKSPACE_FOLDER/packages/aruco-pkg:/home/aruco/vision-ws/src/aruco-ros
    command: >
      bash -ic "
      colcon build --parallel-workers 6;
      source /home/aruco/vision-ws/install/local_setup.bash;
      ros2 launch aruco_ros CB_ALL.launch.py;
      "
  
  ultralytics-ros:
    image: vision-main:ultralytics-ros
    container_name: ultralytics-ros
    volumes:
      - $LOCAL_WORKSPACE_FOLDER/config/dds-uri/localDDS.xml:/tmp/cycloneDDS.xml
      - $LOCAL_WORKSPACE_FOLDER/packages/ultralytics-pkg:/home/ultralytics/vision-ws/src/ultralytics-ros
    command: >
      bash -ic "
      colcon build --base-paths /home/ultralytics/vision-ws;
      source /home/ultralytics/vision-ws/install/local_setup.bash;
      ros2 launch ultralytics_ros yolo_tf_launch.py
      "

  ultralytics-training:
    image: ultralytics/ultralytics:latest
    container_name: ultralytics-training
    volumes:
      - $LOCAL_WORKSPACE_FOLDER/dataset:/root/train
    working_dir: /root/train
    command: bash
      # bash -ic 'nvidia-smi && bash'
  
  gui:
    image: vision-main:gui
    container_name: gui
    volumes:
      # X11 socket
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/home/gui/.Xauthority
      # Wayland socket
      # - $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY:/tmp/$WAYLAND_DISPLAY
      # GUI config
      - $LOCAL_WORKSPACE_FOLDER/packages/gui-config:/home/gui/.rviz2
      - $LOCAL_WORKSPACE_FOLDER/config/dds-uri/localDDS.xml:/tmp/cycloneDDS.xml
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml address:=localhost port:=8765